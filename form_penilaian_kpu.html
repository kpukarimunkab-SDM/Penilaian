<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Penilaian Kinerja KPU</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Icon Bintang -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS untuk Rating Bintang */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }
        .star-rating input[type="radio"] {
            display: none;
        }
        .star-rating label {
            font-size: 2rem;
            color: #d1d5db; /* gray-300 */
            cursor: pointer;
            transition: color 0.2s;
            padding-right: 5px;
        }
        .star-rating input[type="radio"]:checked ~ label {
            color: #f59e0b; /* amber-500 */
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #fbbf24; /* amber-400 */
        }
        
        /* Toast Notification CSS */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-3xl mx-auto mt-10 mb-10 bg-white p-8 rounded-xl shadow-lg border border-gray-200">
        
        <!-- Header -->
        <div class="text-center mb-8 border-b pb-6">
            <h2 class="text-2xl font-bold text-gray-800 uppercase tracking-wide">Form Penilaian Kinerja</h2>
            <p class="text-gray-500 text-sm mt-1">Komisi Pemilihan Umum (KPU)</p>
        </div>

        <form id="appraisalForm">
            
            <!-- SECTION 1: Data Pegawai yang Dinilai -->
            <div class="mb-8">
                <h3 class="text-lg font-bold text-red-800 mb-4 border-l-4 border-red-800 pl-3">A. Data Pegawai</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Pilih Pegawai (NIP)</label>
                        <select name="nip_pegawai" id="nip_pegawai" onchange="autofillPegawai()" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-800 outline-none transition bg-white cursor-pointer">
                            <option value="">-- Memuat Data... --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Pegawai</label>
                        <input type="text" id="nama_pegawai" name="nama_pegawai" readonly class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-gray-100 outline-none text-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Pangkat / Golongan</label>
                        <input type="text" id="pangkat_pegawai" name="pangkat_pegawai" readonly class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-gray-100 outline-none text-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Subbagian / Unit Kerja</label>
                        <input type="text" id="unit_kerja" name="unit_kerja" readonly class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-gray-100 outline-none text-gray-600">
                    </div>
                </div>
            </div>

            <!-- SECTION 2: Data Pejabat Penilai -->
            <div class="mb-8">
                <h3 class="text-lg font-bold text-red-800 mb-4 border-l-4 border-red-800 pl-3">B. Data Penilai</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Periode Penilaian</label>
                        <input type="text" id="periode" name="periode" readonly placeholder="Otomatis terisi..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-gray-100 outline-none text-gray-600">
                    </div>
                    <div></div> <!-- Empty div for spacing -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Penilai (Kasubbag)</label>
                        <select name="nama_penilai" id="nama_penilai" onchange="autofillPenilai()" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-800 outline-none transition bg-white cursor-pointer">
                            <option value="">-- Memuat Data... --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Jabatan Penilai</label>
                        <input type="text" id="jabatan_penilai" name="jabatan_penilai" readonly class="w-full border border-gray-300 rounded-lg p-2.5 text-sm bg-gray-100 outline-none text-gray-600">
                    </div>
                </div>
            </div>

            <!-- SECTION 3: Indikator Penilaian (P1 - P8) -->
            <div class="mb-8">
                <h3 class="text-lg font-bold text-red-800 mb-4 border-l-4 border-red-800 pl-3">C. Aspek Penilaian (Skala 1-5)</h3>
                <div class="bg-blue-50 border border-blue-200 text-blue-800 rounded-lg p-4 mb-6 text-sm">
                    <strong>Petunjuk:</strong> Berikan penilaian untuk setiap indikator kinerja di bawah ini dengan mengklik bintang (1 = Sangat Kurang, 5 = Sangat Baik).
                </div>
                
                <div class="space-y-6">
                    <!-- Template Pertanyaan P1 sampai P8 diproses menggunakan JavaScript di bawah untuk meringkas kode -->
                    <div id="questions-container"></div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-8 pt-6 border-t flex justify-end">
                <button type="button" onclick="submitForm()" id="btnSubmit" class="bg-red-700 hover:bg-red-800 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-colors focus:ring-4 focus:ring-red-300">
                    <i class="fas fa-paper-plane mr-2"></i> Simpan Penilaian
                </button>
            </div>
        </form>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast">Notifikasi</div>

    <script>
        // --- 1. GENERATE PERTANYAAN (P1 - P8) SECARA OTOMATIS ---
        const indicators = [
            "P1: Orientasi Pelayanan",
            "P2: Integritas",
            "P3: Komitmen",
            "P4: Disiplin",
            "P5: Kerjasama",
            "P6: Kepemimpinan",
            "P7: Inisiatif Kerja",
            "P8: Kecakapan / Kualitas Kerja"
        ];

        const container = document.getElementById('questions-container');
        let htmlContent = '';
        
        indicators.forEach((text, index) => {
            let pName = 'P' + (index + 1);
            htmlContent += `
            <div class="p-4 border rounded-lg bg-white shadow-sm hover:shadow-md transition">
                <label class="block font-semibold text-gray-700 mb-2">${text}</label>
                <div class="star-rating">
                    <input type="radio" id="${pName}-5" name="${pName}" value="5"><label for="${pName}-5"><i class="fas fa-star"></i></label>
                    <input type="radio" id="${pName}-4" name="${pName}" value="4"><label for="${pName}-4"><i class="fas fa-star"></i></label>
                    <input type="radio" id="${pName}-3" name="${pName}" value="3"><label for="${pName}-3"><i class="fas fa-star"></i></label>
                    <input type="radio" id="${pName}-2" name="${pName}" value="2"><label for="${pName}-2"><i class="fas fa-star"></i></label>
                    <input type="radio" id="${pName}-1" name="${pName}" value="1"><label for="${pName}-1"><i class="fas fa-star"></i></label>
                </div>
            </div>`;
        });
        container.innerHTML = htmlContent;


        // --- 2. INTEGRASI GOOGLE APPS SCRIPT & AUTOFILL ---
        let globalPegawaiData = [];
        let globalKasubbagData = [];

        document.addEventListener('DOMContentLoaded', function() {
            // Memanggil fungsi getInitialData dari Code.gs
            google.script.run.withSuccessHandler(populateDropdowns).getInitialData();
        });

        function populateDropdowns(data) {
            globalPegawaiData = data.pegawai;
            globalKasubbagData = data.kasubbag;
            
            const nipSelect = document.getElementById('nip_pegawai');
            nipSelect.innerHTML = '<option value="">-- Pilih NIP Pegawai --</option>';
            globalPegawaiData.forEach(p => {
                nipSelect.innerHTML += `<option value="${p.nip}">${p.nip} - ${p.nama}</option>`;
            });

            const penilaiSelect = document.getElementById('nama_penilai');
            penilaiSelect.innerHTML = '<option value="">-- Pilih Nama Penilai --</option>';
            globalKasubbagData.forEach(k => {
                penilaiSelect.innerHTML += `<option value="${k.nama}">${k.nama}</option>`;
            });
        }

        function autofillPegawai() {
            const selectedNip = document.getElementById('nip_pegawai').value;
            const pegawai = globalPegawaiData.find(p => p.nip === selectedNip);
            
            if(pegawai) {
                document.getElementById('nama_pegawai').value = pegawai.nama;
                document.getElementById('pangkat_pegawai').value = pegawai.golongan;
                document.getElementById('unit_kerja').value = pegawai.subbagian;
                document.getElementById('periode').value = pegawai.periode;
            } else {
                document.getElementById('nama_pegawai').value = '';
                document.getElementById('pangkat_pegawai').value = '';
                document.getElementById('unit_kerja').value = '';
                document.getElementById('periode').value = '';
            }
        }

        function autofillPenilai() {
            const selectedNama = document.getElementById('nama_penilai').value;
            const penilai = globalKasubbagData.find(k => k.nama === selectedNama);
            
            if(penilai) {
                document.getElementById('jabatan_penilai').value = penilai.jabatan;
            } else {
                document.getElementById('jabatan_penilai').value = '';
            }
        }

        // --- 3. LOGIKA SUBMIT DAN NOTIFIKASI ---
        function submitForm() {
            let missingQuestions = [];
            
            // Validasi Input Bintang P1 - P8
            for (let i = 1; i <= 8; i++) {
                let variableName = 'P' + i;
                let checked = document.querySelector(`input[name="${variableName}"]:checked`);
                if (!checked) {
                    missingQuestions.push('P' + i);
                }
            }

            // Validasi Dropdown
            if (!document.getElementById('nip_pegawai').value || !document.getElementById('nama_penilai').value) {
                showToast('Mohon lengkapi data Pegawai dan Penilai!', 'red');
                return;
            }

            // Validasi Penilaian
            if (missingQuestions.length > 0) {
                showToast(`Mohon lengkapi indikator: ${missingQuestions.join(', ')}`, 'red');
                return;
            }

            // Nonaktifkan tombol sementara agar tidak dobel klik
            const btnSubmit = document.getElementById('btnSubmit');
            const originalBtnText = btnSubmit.innerHTML;
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...';
            btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');

            const form = document.getElementById('appraisalForm');
            
            // Panggil server side (Code.gs)
            google.script.run
                .withSuccessHandler(function(response) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = originalBtnText;
                    btnSubmit.classList.remove('opacity-75', 'cursor-not-allowed');
                    
                    if(response.success) {
                        showSuccessModal();
                        form.reset(); // Mengosongkan form
                        // Mengosongkan field readonly manual jika diperlukan
                        autofillPegawai(); 
                        autofillPenilai();
                    } else {
                        showToast(response.message, 'red');
                    }
                })
                .withFailureHandler(function(error) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = originalBtnText;
                    btnSubmit.classList.remove('opacity-75', 'cursor-not-allowed');
                    showToast('Terjadi kesalahan koneksi!', 'red');
                })
                .submitPenilaian(form);
        }

        // --- HELPER FUNCTIONS (UI) ---
        function showToast(msg, colorType) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.style.backgroundColor = colorType === 'red' ? '#dc2626' : '#16a34a';
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function showSuccessModal() {
            // Bisa diganti dengan SweetAlert, untuk default menggunakan alert/toast
            alert("✅ Berhasil! Data penilaian kinerja berhasil disimpan ke Spreadsheet.");
        }
    </script>
</body>
</html>
