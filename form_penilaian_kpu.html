<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Penilaian Kinerja</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .maroon-custom { background-color: #800000; }
        .text-maroon-custom { color: #800000; }
        
        /* Star Rating System (CSS Only for Hover/Selection) */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }
        .star-rating input { display: none; }
        .star-rating label {
            cursor: pointer;
            font-size: 1.5rem;
            color: #d1d5db; /* gray-300 */
            transition: color 0.2s;
            margin-right: 0.25rem;
        }
        /* Pewarnaan Bintang saat di-hover dan dipilih */
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #eab308; /* yellow-500 */
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4 sm:px-6">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Header -->
        <div class="maroon-custom px-8 py-6 text-white text-center">
            <h1 class="text-2xl sm:text-3xl font-bold mb-2">Formulir Penilaian Kinerja</h1>
            <p class="text-sm opacity-90">Evaluasi dan Penilaian Kinerja Periode Berjalan</p>
        </div>

        <form id="appraisalForm" class="p-6 sm:p-8">
            
            <!-- Informasi Penilaian -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8 pb-6 border-b border-gray-200">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Penilai</label>
                    <input type="text" name="namaPenilai" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-900 focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nama yang Dinilai</label>
                    <input type="text" name="namaDinilai" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-900 focus:border-transparent outline-none">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Jabatan / Unit Kerja</label>
                    <input type="text" name="jabatan" required class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-900 focus:border-transparent outline-none">
                </div>
            </div>

            <div class="mb-6 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800">Indikator Penilaian</h2>
                <div class="bg-gray-100 px-4 py-2 rounded-lg text-sm font-semibold">
                    Total Skor: <span id="totalScore" class="text-maroon-custom text-lg">0</span> / 40
                </div>
            </div>

            <!-- List Pertanyaan P1 - P8 (Dibuat menggunakan JavaScript di client-side agar lebih rapi di HTML) -->
            <div id="criteriaContainer" class="space-y-6"></div>

            <!-- Catatan Tambahan -->
            <div class="mt-8">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Catatan Tambahan / Ulasan</label>
                <textarea name="catatan" rows="4" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-900 focus:border-transparent outline-none resize-y placeholder-gray-400" placeholder="Berikan catatan, evaluasi, atau saran pengembangan..."></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="mt-8 pt-6 border-t border-gray-200 flex flex-col-reverse sm:flex-row justify-end gap-3 sm:gap-4">
                <button type="reset" id="btnReset" class="px-6 py-3 border border-gray-300 text-gray-700 font-bold rounded-xl hover:bg-gray-50 transition-all text-sm w-full sm:w-auto">
                    Reset Form
                </button>
                <button type="submit" id="btnSubmit" class="px-6 py-3 maroon-custom text-white font-bold rounded-xl hover:bg-red-900 shadow-lg transition-all text-sm w-full sm:w-auto flex items-center justify-center">
                    <i class="fas fa-paper-plane mr-2"></i> Kirim Penilaian
                </button>
            </div>
            
        </form>
    </div>

    <!-- Logika Antarmuka & Integrasi Google Apps Script -->
    <script>
        // Data Indikator Penilaian
        const kriteria = [
            { id: 'P1', judul: 'Integritas & Etika', deskripsi: 'Kepatuhan pada aturan dan kejujuran dalam bekerja.' },
            { id: 'P2', judul: 'Profesionalitas', deskripsi: 'Penguasaan tugas dan tanggung jawab secara mandiri.' },
            { id: 'P3', judul: 'Orientasi Hasil', deskripsi: 'Pencapaian target kerja dan kualitas output.' },
            { id: 'P4', judul: 'Kerja Sama Tim', deskripsi: 'Kemampuan berkolaborasi dan membantu rekan kerja.' },
            { id: 'P5', judul: 'Komunikasi', deskripsi: 'Penyampaian informasi yang jelas dan efektif.' },
            { id: 'P6', judul: 'Kedisiplinan', deskripsi: 'Kehadiran dan ketepatan waktu dalam penyelesaian tugas.' },
            { id: 'P7', judul: 'Pelayanan Publik', deskripsi: 'Sikap responsif dan solutif terhadap pemangku kepentingan.' },
            { id: 'P8', judul: 'Inisiatif & Inovasi', deskripsi: 'Kemauan mencari solusi baru atau ide perbaikan.' }
        ];

        // Generate HTML Kriteria secara dinamis
        const container = document.getElementById('criteriaContainer');
        kriteria.forEach(item => {
            const html = `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                <div class="mb-3 sm:mb-0 sm:w-2/3">
                    <p class="font-bold text-gray-800">${item.id}. ${item.judul}</p>
                    <p class="text-sm text-gray-500">${item.deskripsi}</p>
                </div>
                <div class="flex items-center gap-4 sm:w-1/3 sm:justify-end">
                    <div class="star-rating" onchange="updateScore()">
                        <input type="radio" id="${item.id}-5" name="${item.id}" value="5"><label for="${item.id}-5" class="fas fa-star"></label>
                        <input type="radio" id="${item.id}-4" name="${item.id}" value="4"><label for="${item.id}-4" class="fas fa-star"></label>
                        <input type="radio" id="${item.id}-3" name="${item.id}" value="3"><label for="${item.id}-3" class="fas fa-star"></label>
                        <input type="radio" id="${item.id}-2" name="${item.id}" value="2"><label for="${item.id}-2" class="fas fa-star"></label>
                        <input type="radio" id="${item.id}-1" name="${item.id}" value="1"><label for="${item.id}-1" class="fas fa-star"></label>
                    </div>
                    <div class="w-10 text-center font-bold text-gray-700 bg-gray-100 py-1 rounded">
                        <span id="val-${item.id}">0</span>
                    </div>
                </div>
            </div>`;
            container.innerHTML += html;
        });

        // Update Skor Bintang & Total
        function updateScore() {
            let totalSkor = 0;
            kriteria.forEach(item => {
                const selected = document.querySelector(`input[name="${item.id}"]:checked`);
                const nilai = selected ? parseInt(selected.value) : 0;
                document.getElementById(`val-${item.id}`).innerText = nilai;
                totalSkor += nilai;
            });
            document.getElementById('totalScore').innerText = totalSkor;
        }

        // Reset Custom (Update visual angka ke 0)
        document.getElementById('btnReset').addEventListener('click', () => {
            setTimeout(() => updateScore(), 100); 
        });

        // Submit Form ke Google Apps Script
        document.getElementById('appraisalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validasi kelengkapan 8 indikator
            let valid = true;
            kriteria.forEach(item => {
                if (!document.querySelector(`input[name="${item.id}"]:checked`)) valid = false;
            });

            if (!valid) {
                alert('Mohon lengkapi semua indikator (P1 - P8) sebelum mengirim.');
                return;
            }

            // Ubah tombol jadi loading
            const btnSubmit = document.getElementById('btnSubmit');
            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memproses...';
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');

            // Eksekusi fungsi GS simpanData
            google.script.run
                .withSuccessHandler(function(response) {
                    if(response.status === 'success') {
                        alert(response.message);
                        document.getElementById('appraisalForm').reset();
                        updateScore(); // kembalikan angka ke 0
                    } else {
                        alert('Gagal: ' + response.message);
                    }
                    resetButton(btnSubmit, originalText);
                })
                .withFailureHandler(function(error) {
                    alert('Terjadi kesalahan jaringan/sistem: ' + error.message);
                    resetButton(btnSubmit, originalText);
                })
                .simpanData(this); // Mengirim seluruh elemen form (termasuk name attr) ke GS
        });

        function resetButton(btn, text) {
            btn.innerHTML = text;
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
